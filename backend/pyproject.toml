[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danmaku-migration"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "SQLAlchemy>=2,<3", "pysubs2>=1.7,<2", "httpx>=0.27,<0.29"]

[project.optional-dependencies]
bilibili = ["bilibili-api-python==17.4.2"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
